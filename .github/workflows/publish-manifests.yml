name: Publish Provider Manifests

# Exports validated, SHA-256 hashed provider JSON manifests to GitHub Pages
# at https://churchapps.github.io/Packages/providers/v1/index.json whenever
# manifest files change on main (or on manual workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "content-providers/src/manifests/**"
      - "content-providers/scripts/export-manifests.ts"
      - ".github/workflows/publish-manifests.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  YARN_ENABLE_HARDENED_MODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: corepack enable

      - run: yarn install --immutable

      - name: Test content-providers
        run: yarn workspace @churchapps/content-providers test

      - name: Export validated manifests
        run: |
          mkdir -p _site/providers/v1
          yarn workspace @churchapps/content-providers export:manifests "$(pwd)/_site/providers/v1"
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>ChurchApps Content Provider Manifests</title></head>
            <body>
              <h1>ChurchApps Content Provider Manifests</h1>
              <p>Hosted JSON provider index (engine v1): <a href="./providers/v1/index.json"><code>./providers/v1/index.json</code></a></p>
              <p>Documentation: <a href="https://github.com/ChurchApps/Packages/blob/main/content-providers/CUSTOM_PROVIDERS.md">Creating Custom Content Providers</a></p>
            </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
