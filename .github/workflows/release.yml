name: Release

# Publishes via npm trusted publishing (OIDC) — no npm token. Each package's trusted
# publisher on npmjs.com must name this exact file: release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  YARN_ENABLE_HARDENED_MODE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: corepack enable

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.16.0

      - run: yarn install --immutable

      - name: Version pending changesets
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "No pending changesets."
            exit 0
          fi
          yarn version-packages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version packages"
          git push

      - run: yarn build

      # Idempotent: publishes only versions not already on the registry, so a rerun after a partial failure is safe.
      - name: Publish
        run: |
          for dir in helpers apihelper apphelper content-providers integration-sdk texting; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              (cd "$dir" && npm publish --provenance --access public --ignore-scripts)
            fi
          done
