name: Release

# Publishes via npm trusted publishing (OIDC) — no npm token. Each package's trusted
# publisher on npmjs.com must name this exact file: release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  YARN_ENABLE_HARDENED_MODE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: corepack enable

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.16.0

      - run: yarn install --immutable

      - name: Version pending changesets
        id: version
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "No pending changesets."
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          yarn version-packages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          branch="changeset-release-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A
          git commit -m "Version packages"
          git push -u origin HEAD
          gh pr create --base main --head "$branch" \
            --title "Version packages" \
            --body "Changeset version bump opened by the release workflow. Merging this pull request publishes the packages."
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # Publish only the versions already on main. A newly opened version pull request
      # publishes on the run that follows its merge.
      - name: Build
        if: steps.version.outputs.opened != 'true'
        run: yarn build

      - name: Publish
        if: steps.version.outputs.opened != 'true'
        run: |
          for dir in helpers apihelper apphelper content-providers integration-sdk texting; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              (cd "$dir" && npm publish --provenance --access public --ignore-scripts)
            fi
          done
